  contenidos = ["Covarianza muestral y estimadores de contracción.", "Sesgo de la covarianza muestral en la distancia afín-invariante.", "Rango, referencia promedio y eliminación de componentes independientes.", "Ventanas temporales y no estacionariedad.", "Laboratorio: sesgo frente al tamaño muestral."]

  [[partes.capitulos]]
