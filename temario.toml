  slug = "18-transferencia"
  titulo = "Aprendizaje por transferencia y alineamiento"
  estado = "en-preparacion"
  resumen = "Re-centrado, Procrustes riemanniano, alineamiento euclídeo y transporte paralelo entre sesiones y sujetos."
  prerrequisitos = "Capítulos 8 y 12."
  objetivos = ["Distinguir re-centrado, alineamiento y proyección tangente.", "Corregir corrimientos entre sesiones con herramientas geométricas."]
  contenidos = ["Re-centrado por congruencia.", "Procrustes riemanniano y alineamiento euclídeo.", "Transporte paralelo entre dominios.", "Laboratorio: corrimiento simulado entre sesiones."]

  [[partes.capitulos]]
  num = 19
  slug = "19-neuromind"
  titulo = "Puente metodológico con NeuroMIND"
  estado = "en-preparacion"
  resumen = "Diseño de análisis longitudinales geométricos con código genérico y datos sintéticos."
  prerrequisitos = "Capítulos 8 a 18."
  objetivos = ["Diseñar análisis longitudinales sobre trayectorias en SPD.", "Separar métodos publicables de datos que no lo son."]
  contenidos = ["Trayectorias en SPD y distancias intra- e intersujeto.", "Modelos mixtos sobre el espacio tangente.", "Protocolos y datos sintéticos que imitan la estructura de un estudio longitudinal.", "Qué se publica y qué no: métodos frente a datos."]

