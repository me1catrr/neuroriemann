  prerrequisitos = "Capítulos 1, 6 y 16."
  objetivos = ["Formular CSP como autoproblema generalizado.", "Relacionar CSP con la distancia afín-invariante entre clases."]
  contenidos = ["CSP como autoproblema generalizado.", "Relación con la distancia afín-invariante.", "CSP regularizado y filtros riemannianos.", "Laboratorio: CSP frente a clasificación riemanniana con datos sintéticos."]

  [[partes.capitulos]]
